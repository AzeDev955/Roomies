services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "3001:3000"
    command: sh -c "npx prisma generate && until npx prisma db push --force-reset; do echo 'DB not ready, retrying...'; sleep 3; done && npx prisma db seed && npm run dev"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:3001}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      MEDIA_PROVIDER: ${MEDIA_PROVIDER:-backblaze}
      MEDIA_SIGNED_URL_TTL_SECONDS: ${MEDIA_SIGNED_URL_TTL_SECONDS:-900}
      MEDIA_SHARED_SIGNED_URL_TTL_SECONDS: ${MEDIA_SHARED_SIGNED_URL_TTL_SECONDS:-900}
      MEDIA_PRIVATE_SIGNED_URL_TTL_SECONDS: ${MEDIA_PRIVATE_SIGNED_URL_TTL_SECONDS:-300}
      MEDIA_CACHE_CONTROL: ${MEDIA_CACHE_CONTROL:-public, max-age=31536000, immutable}
      MEDIA_IMAGE_MAX_SIZE_BYTES: ${MEDIA_IMAGE_MAX_SIZE_BYTES:-10485760}
      MEDIA_IMAGE_WEBP_QUALITY: ${MEDIA_IMAGE_WEBP_QUALITY:-82}
      MEDIA_IMAGE_KEEP_ORIGINAL: ${MEDIA_IMAGE_KEEP_ORIGINAL:-false}
      B2_ENDPOINT: ${B2_ENDPOINT:-}
      B2_REGION: ${B2_REGION:-}
      B2_BUCKET_NAME: ${B2_BUCKET_NAME:-}
      B2_APPLICATION_KEY_ID: ${B2_APPLICATION_KEY_ID:-}
      B2_APPLICATION_KEY: ${B2_APPLICATION_KEY:-}
      B2_PUBLIC_BASE_URL: ${B2_PUBLIC_BASE_URL:-}
      SEED_CASERO_PASSWORD: ${SEED_CASERO_PASSWORD:-casero123}
      SEED_INQUILINO_PASSWORD: ${SEED_INQUILINO_PASSWORD:-inquilino123}
      SEED_DEMO_DOMAIN: ${SEED_DEMO_DOMAIN:-test.com}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    command: npx expo start --host lan --port 8080 --clear
    environment:
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://${HOST_IP}:3001/api}
      REACT_NATIVE_PACKAGER_HOSTNAME: ${HOST_IP}
      EXPO_PUBLIC_MAPBOX_TOKEN: ${EXPO_PUBLIC_MAPBOX_TOKEN}
      EXPO_PUBLIC_GOOGLE_CLIENT_ID: ${EXPO_PUBLIC_GOOGLE_CLIENT_ID:-}
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID:-}
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID:-}
      EXPO_TOKEN: ${EXPO_TOKEN}
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
